services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-personal_drive_os}
      POSTGRES_USER: ${SQL_USER:-${SQL_ADMIN_USER:-postgres}}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-${SQL_ADMIN_PASSWORD:-driveos_persistent_pg_pass}}
    volumes:
      - driveos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-${SQL_ADMIN_USER:-postgres}} -d ${SQL_DB_NAME:-personal_drive_os}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      SQL_HOST: ${SQL_HOST:-postgres}
      SQL_PORT: ${SQL_PORT:-5432}
      SQL_DB_NAME: ${SQL_DB_NAME:-personal_drive_os}
      SQL_USER: ${SQL_USER:-${SQL_ADMIN_USER:-postgres}}
      SQL_PASSWORD: ${SQL_PASSWORD:-${SQL_ADMIN_PASSWORD:-driveos_persistent_pg_pass}}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:-${SQL_USER:-postgres}}
      SQL_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:-${SQL_PASSWORD:-driveos_persistent_pg_pass}}
      SESSION_SECRET: ${SESSION_SECRET:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-common}
    volumes:
      - driveos_tmp:/tmp/driveos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  driveos_pgdata:
  driveos_tmp:
